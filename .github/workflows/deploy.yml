name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Create a clean temporary directory for deployment
          mkdir deploy_dir
          
          # 2. Copy only the necessary runtime files (excluding large assets and git history)
          cp -r app.py bug_rescue.py Dockerfile requirements.txt .streamlit deploy_dir/
          
          # 2.5. Generate README.md with Hugging Face Space metadata
          echo '---' > deploy_dir/README.md
          echo 'title: Bug-Fixer' >> deploy_dir/README.md
          echo 'emoji: 🐞' >> deploy_dir/README.md
          echo 'colorFrom: green' >> deploy_dir/README.md
          echo 'colorTo: indigo' >> deploy_dir/README.md
          echo 'sdk: docker' >> deploy_dir/README.md
          echo 'pinned: false' >> deploy_dir/README.md
          echo '---' >> deploy_dir/README.md
          echo '# Bug-Fixer' >> deploy_dir/README.md
          echo 'Autonomous AI-powered code repair assistant.' >> deploy_dir/README.md
          
          # 3. Initialize a fresh Git repository in the deployment directory
          cd deploy_dir
          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 4. Stage and commit files
          git add .
          git commit -m "Deploy BugRescue to Hugging Face Spaces"
          
          # 5. Force push the clean single commit to Hugging Face
          git push --force https://DhruvSoni:$HF_TOKEN@huggingface.co/spaces/DhruvSoni/Bug-Fixer main

